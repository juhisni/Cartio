<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cartio app information and privacy policy">
  <title>Cartio</title>
  <style>
    :root { color-scheme: light dark; --green: #2e9e44; --bg: #f8faf7; --card: #fff; --text: #17201b; --muted: #526058; }
    @media (prefers-color-scheme: dark) { :root { --bg: #101512; --card: #19201c; --text: #edf4ef; --muted: #b7c3bb; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 20px; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 32px; background: var(--card); border-radius: 20px; }
    h1 { margin: 0 0 8px; font-size: 2.25rem; }
    p { color: var(--muted); }
    a { color: var(--green); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Cartio</h1>
    <p>Shopping, simplified.</p>
    <p><a href="privacy/">Privacy policy / Tietosuojakäytäntö</a></p>
    <p><a href="legal/">Legal &amp; licenses / Lakiasiat ja lisenssit</a></p>
    <p>Support: <a href="mailto:cartiosupport@gmail.com">cartiosupport@gmail.com</a></p>
  </main>
</body>
</html>
